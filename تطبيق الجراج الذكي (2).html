<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الجراج الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#E9EDF3;--card:#fff;--ink:#17202B;--mute:#667385;--line:#C9D0D9;--blue:#2459E0;--bluebg:#E4ECFD;--onblue:#fff;--ev:#0E9F73;--evbg:#DDF4EB;--acc:#7A4DE0;--accbg:#ECE6FB;--free:#fff;--taken:#CBD1D9;--sel:#E3A21A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151C;--card:#1A222D;--ink:#EEF1F5;--mute:#9AA6B6;--line:#334053;--blue:#6C93FF;--bluebg:#1D2A4D;--onblue:#0B1220;--ev:#38D39F;--evbg:#12362B;--acc:#A98BFF;--accbg:#2A2147;--free:#1A222D;--taken:#2B3441;--sel:#F0B73A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151C;--card:#1A222D;--ink:#EEF1F5;--mute:#9AA6B6;--line:#334053;--blue:#6C93FF;--bluebg:#1D2A4D;--onblue:#0B1220;--ev:#38D39F;--evbg:#12362B;--acc:#A98BFF;--accbg:#2A2147;--free:#1A222D;--taken:#2B3441;--sel:#F0B73A;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:430px;height:100%;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.view{display:none;flex:1;overflow-y:auto;padding:16px 16px 24px}.view.on{display:block}
h1{font-size:23px;font-weight:800;margin:0}h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--mute);margin:2px 0 12px}
.hero{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#1B3FA8,#2459E0 55%,#12A5A0);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px}
.hero p{margin:2px 0 0;opacity:.88;font-size:13px}.logo{font-size:32px;background:rgba(255,255,255,.2);width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{border-radius:14px;padding:10px 4px;text-align:center;background:var(--bluebg)}.st i{font-style:normal;font-size:18px}
.st b{display:block;font-size:19px;font-weight:800;color:var(--blue)}.st span{font-size:11px;color:var(--mute)}
.st.g{background:var(--evbg)}.st.g b{color:var(--ev)}.st.p{background:var(--accbg)}.st.p b{color:var(--acc)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 0;font-size:12px;border-radius:9px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--blue);color:var(--onblue)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13px}
.chips button.on{border-color:var(--blue);background:var(--bluebg);color:var(--blue);font-weight:700}
.lot{background:var(--card);border-radius:16px;padding:12px 10px}
.row{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.lane{margin:10px 0;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;background:repeating-linear-gradient(90deg,transparent 0 14px,var(--line) 14px 15px)}
.spot{position:relative;height:66px;border:2px solid var(--line);background:var(--free);border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding:0 0 4px;font-size:10px;font-weight:600;color:var(--mute)}
.spot.ev{border-color:var(--ev);background:var(--evbg)}
.spot.ev::after{content:"⚡";position:absolute;top:3px;font-size:11px}
.spot.acc{border-color:var(--acc);background:var(--accbg)}
.spot.acc::after{content:"♿";position:absolute;top:3px;font-size:12px}
.spot.taken{background:var(--taken);border-color:transparent;cursor:default}
.spot.taken::after{display:none}
.spot.taken::before{content:"";position:absolute;top:8px;width:60%;height:60%;border-radius:8px 8px 4px 4px;background:rgba(120,130,145,.55)}
.spot.mine{background:var(--sel);border-color:var(--sel);color:#17202B}.spot.mine::before{background:rgba(0,0,0,.25)}
.spot.buf{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--sel) 35%,transparent) 0 5px,transparent 5px 10px);border:2px dashed var(--sel);color:var(--mute)}.spot.buf::before{display:none}.spot.buf::after{display:block;content:'⏳';position:absolute;top:3px;font-size:11px}.spot.dim{opacity:.3}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;color:var(--mute);font-size:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid var(--line);vertical-align:-2px;margin-inline-end:4px}
.legend u{text-decoration:none}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;padding:7px 0;font-size:12px;font-weight:600;color:var(--mute);position:relative;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button.on{color:var(--blue)}nav i{font-style:normal;font-size:20px}
nav .dot{position:absolute;top:6px;inset-inline-end:28%;width:9px;height:9px;border-radius:50%;background:var(--ev);display:none}
.primary{width:100%;border:0;background:linear-gradient(135deg,#2459E0,#12A5A0);color:#fff;padding:14px;border-radius:12px;font-weight:800;font-size:16px}
.primary:disabled{opacity:.6}
.ghost{width:100%;border:1px solid var(--line);background:none;padding:12px;border-radius:12px;margin-top:10px;font-weight:600}
.mini{border:0;background:var(--bluebg);color:var(--blue);padding:6px 14px;border-radius:10px;font-weight:700}
#sheet{position:absolute;inset:auto 0 0 0;max-height:92%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px 22px;transform:translateY(105%);transition:transform .25s;box-shadow:0 -8px 30px rgba(0,0,0,.25);z-index:5}
#sheet.open{transform:none}#veil{position:absolute;inset:0;background:rgba(10,16,28,.55);z-index:4;display:none}#veil.on{display:block}
.k{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.k span:first-child{color:var(--mute)}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-weight:700;font-size:12px;background:var(--evbg);color:var(--ev);margin-inline-start:6px}.badge.p{background:var(--accbg);color:var(--acc)}
.step{display:flex;align-items:center;gap:12px}.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;font-size:18px}
.lb{display:block;color:var(--mute);font-size:13px;margin:6px 0 4px}
.pm{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid transparent;border-radius:12px;padding:12px;margin-bottom:8px;width:100%;text-align:start}
.pm.on{border-color:var(--blue);background:var(--bluebg)}
input{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:8px;direction:ltr;text-align:start}
input[type=checkbox]{width:auto;margin:0;accent-color:var(--blue)}.chk{display:flex;gap:8px;align-items:center;margin:4px 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tk{background:var(--card);border-radius:18px;padding:18px;text-align:center}.tk.sm{text-align:start;margin-bottom:12px;padding:10px 16px}
#qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin:10px 0}
.badge.s{background:var(--evbg);color:var(--ev);margin:0}
.empty{text-align:center;color:var(--mute);padding:60px 10px}.cdw{background:var(--bluebg);border-radius:14px;padding:10px 14px;margin-bottom:12px;text-align:center}.cdt{font-weight:800;font-size:18px}.pgw{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}.pgw b{display:block;height:100%;width:0;transition:width .4s linear}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ft{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ft i{font-style:normal;font-size:22px;width:42px;height:42px;border-radius:12px;background:var(--bluebg);display:grid;place-items:center;flex:none}
#tut{position:absolute;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;gap:8px}
#tut p{color:var(--mute);max-width:300px;margin:0}#tut .primary,#tut .ghost{max-width:320px}
.art{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;font-size:54px;margin-bottom:10px}
.c0{background:linear-gradient(135deg,#BFD3FF,#9FE3DC)}.c1{background:linear-gradient(135deg,#FFE2A8,#FFC4A8)}.c2{background:linear-gradient(135deg,#C9F0DE,#BFD3FF)}.c3{background:linear-gradient(135deg,#DCCFFB,#BFD3FF)}
.dots{display:flex;gap:6px;margin:6px 0 12px}.dots b{width:8px;height:8px;border-radius:5px;background:var(--line)}.dots b.on{background:var(--blue);width:22px}
.lg{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:16px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 12px;font-weight:700}
#toast{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;text-align:center}
#toast.on{opacity:1}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
.warn{background:color-mix(in srgb,#E5484D 14%,var(--card));border:1px solid #E5484D;border-radius:12px;padding:10px;margin:8px 0;font-size:13px}.okb{color:var(--ev);font-weight:700;font-size:13px;margin:8px 0}.slots{margin-top:8px;font-size:13px}.slots span{display:inline-block;background:var(--bluebg);color:var(--blue);border-radius:8px;padding:2px 8px;margin:4px 0 0;margin-inline-end:4px}.slots em{color:var(--mute)}#gb .mini{margin-inline-start:8px}</style></head>
<body><div id="app">

<section class="view on" id="v-home">
  <div class="hero"><div><h1 data-i="app"></h1><p data-i="sub"></p></div><div class="logo">🅿️</div></div><div class="cdw" id="gb" style="display:none"></div>

  </div>
</section>
<section class="view" id="v-pay"></section>
<section class="view" id="v-ticket"></section>
<section class="view" id="v-settings"></section><section class="view" id="v-nav"></section>

<nav><button class="on" data-v="home"><i>🅿️</i><span data-i="nSp"></span></button><button data-v="ticket"><i>🎫</i><span data-i="nTk"></span><b class="dot" id="dot"></b></button><button data-v="settings"><i>⚙️</i><span data-i="nSt"></span></button></nav>
<div id="veil"></div><div id="sheet"></div><div id="tut"></div><div id="toast"></div>
</div>

/* how many extra hours can be added without touching someone else's booking */
function extMax(k){
  if(k.mode=='walk')return{mx:0,why:'noExt'};
  const now=Date.now(),base=k.state=='expired'?now:Math.max(k.endMs,now);
  const o=spot(k.id).res.filter(r=>r!==k.r&&r.s>=k.startMs).map(r=>r.s),lim=o.length?Math.min(...o)-k.buf:Infinity;
  const byDay=k.startMs+24*H-base,byNext=lim-base;
  return{mx:k.demo?(byNext>=5000?1:0):Math.floor(Math.min(byDay,byNext)/H),why:byDay<byNext?'maxH':'noExt'};
}

  if(S.exMax<1){$('#sheet').innerHTML=head+`<p class="warn">${t('noExt')}</p><button class="primary" onclick="exitG()">🚪 ${t('exitG')}</button>`;return}
  $('#sheet').innerHTML=head+`<div class="k"><span>${t('endsNow')}</span><span>${fd(new Date(k.endMs),k.demo)}</span></div><div class="k"><span>⏱️ ${t('extDur')}</span><span class="step"><button onclick="exh(-1)" ${k.demo?'disabled':''}>−</button><b id="exH"></b><button onclick="exh(1)" ${k.demo?'disabled':''}>+</button></span></div><div class="k"><span>${t('newEnd')}</span><span id="exN"></span></div><div class="k"><span>💵 ${t('rate')}</span><span>${n(RATE)}${t('cur')}</span></div><div class="k"><b>${t('tot')}</b><b id="exT"></b></div><p class="sub" style="margin:8px 0 0;font-size:13px">💳 ${t('extPay')}</p><button class="primary" style="margin-top:10px" onclick="doExt()">${t('extGo')}</button>${x?`<button class="ghost" onclick="exitG()">🚪 ${t('exitG')}</button>`:`<button class="ghost" onclick="closeSh()">${t('cancel')}</button>`}`;

  <h2 style="margin-top:16px">✨ ${t('ft')}</h2>${F.map(f=>`<div class="ft"><i>${f[0]}</i><span>${t(f[1])}</span></div>`).join('')}`;
}
function tut(){
  const last=ti==3;
  $('#tut').innerHTML=`<button class="lg" onclick="flip()">${lang=='ar'?'EN':'ع'}</button><div class="art c${ti}"><span>${TI[ti]}</span></div><h2>${t('t'+ti)}</h2><p>${t('x'+ti)}</p>
  <div class="dots">${[0,1,2,3].map(j=>`<b class="${j==ti?'on':''}"></b>`).join('')}</div>
  <button class="primary" onclick="${last?'endTut()':'ti++;tut()'}">${last?t('start'):t('next')}</button><button class="ghost" onclick="endTut()" style="${last?'visibility:hidden':''}">${t('skip')}</button>`;
}
function showTut(){GW=0;ti=0;$('#tut').style.display='flex';tut()}
function endTut(){$('#tut').style.display='none';ls.s('seen',1)}
applyLang();
if((location.hash||'')=='#gate')gWel();else if(!ls.g('seen'))showTut();
setInterval(tick,500);
</script></body></html>
